backend:
  name: github
  repo: shanelykins/asquetaglass
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://asquetaglass.netlify.app
display_url: https://asquetaglass.netlify.app

collections:
  - name: "settings"
    label: "Site Content"
    files:
      - name: "projects"
        label: "Projects"
        file: "public/data/projects.json"
        fields:
          - name: "projects"
            label: "Projects"
            label_singular: "Project"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Shower", "Window", "Storefront", "Custom Glass", "Other"] }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", required: false }
